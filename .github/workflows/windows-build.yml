name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "*.py"
      - "*.spec"
      - "installer.iss"
      - "requirements*.txt"
      - "get_vendor.ps1"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-build.txt

      - name: Install Tesseract and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          choco install innosetup -y --no-progress

      - name: Prepare vendor
        shell: pwsh
        run: ./get_vendor.ps1

      - name: Tests
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          python test_all.py
          python test_cloud.py

      - name: Build exe
        shell: pwsh
        run: pyinstaller --noconfirm BASE_CHECK.spec

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASE_CHECK-windows
          path: |
            dist/*.exe
            dist/BASE_CHECK/**

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe