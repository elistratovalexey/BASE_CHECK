name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip zlib1g-dev \
            libffi-dev libssl-dev autoconf automake libtool pkg-config cmake \
            libncurses5 libtinfo5

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython<3.0" buildozer

      - name: Prepare core + tessdata
        run: bash android/prepare.sh

      - name: Build APK
        run: |
          cd android
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: BASE_CHECK-android
          path: android/bin/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk