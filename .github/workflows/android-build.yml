name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "*.py"
      - "requirements*.txt"
      - ".github/workflows/android-build.yml"
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip zlib1g-dev \
            libffi-dev libssl-dev autoconf automake libtool pkg-config cmake \
            libncurses5 libtinfo5 gettext

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install "cython==0.29.36" "buildozer==1.5.0"

      # --- КЛЮЧ ПОДПИСИ: создаётся сам при первой сборке и хранится в кэше ---
      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: ~/.android-basecheck
          key: basecheck-signing-key-v1

      - name: Signing key (auto)
        shell: bash
        run: bash android/make_keystore.sh
        
      - name: Persist signing key
        shell: bash
        run: |
          if [ ! -f android/basecheck.keystore ]; then
            cp ~/.android-basecheck/basecheck.keystore android/basecheck.keystore
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/basecheck.keystore
            git commit -m "ci: постоянный ключ подписи Android [skip ci]"
            git push
          fi

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-p4a20240121-${{ hashFiles('android/buildozer.spec') }}

      - name: Prepare core and tessdata
        run: bash android/prepare.sh

      - name: Version code
        shell: bash
        run: |
          python - <<'PYEOF'
          import os, re, pathlib
          cfg = pathlib.Path("config.py").read_text(encoding="utf-8")
          ver = re.search(r'APP_VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', cfg).group(1)
          a, b, c = (ver.split(".") + ["0", "0"])[:3]
          run = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          code = int(a) * 10000000 + int(b) * 100000 + int(c) * 1000 + run % 1000
          p = pathlib.Path("android/buildozer.spec")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'(?m)^android\.numeric_version\s*=.*$',
                     f'android.numeric_version = {code}', s)
          p.write_text(s, encoding="utf-8")
          print(f"versionName={ver}  versionCode={code}")
          PYEOF

      - name: Build APK
        shell: bash
        run: |
          cd android
          set +e
          buildozer android "$BUILD_MODE" > build.log 2>&1
          rc=$?
          set -e
          echo "=== mode=$BUILD_MODE exit=$rc ==="
          tail -n 120 build.log
          echo "=== ОШИБКИ ==="
          grep -a -n -iE 'error:|fatal|Traceback|FAILURE|BUILD FAILED|Could not (find|resolve)' build.log | tail -n 60 || true
          ls -lh bin/ 2>/dev/null || echo "bin/ пуст"
          [ "$rc" -eq 0 ] && ls bin/*.apk >/dev/null 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BASE_CHECK-android
          path: android/bin/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/bin/*.apk
